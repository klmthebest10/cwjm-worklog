<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>창원정밀 작업일보</title>
  <meta name="description" content="창원정밀 설비·생산 일일 작업 기록">
  <meta name="theme-color" content="#f4efe6">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="작업일보">
  <link rel="stylesheet" href="style.css?v=9">
  <script>
    try {
      var p = JSON.parse(localStorage.getItem('cwjm_prefs_v1') || '{}');
      var t = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-text">
        <h1>창원정밀 작업일보</h1>
        <p class="sub">일일 설비 · 생산 기록</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="syncPill" class="sync-pill s-local" type="button" title="동기화 상태">
        <i class="dot" aria-hidden="true"></i><span id="syncText">서버 미연결</span>
      </button>
      <button id="installBtn" class="btn btn-sm btn-sky" type="button" hidden>⬇<span class="install-txt"> 앱 설치</span></button>
      <button id="themeBtn" class="btn btn-sm btn-icon" type="button" aria-label="라이트/다크 모드 전환" title="라이트/다크 모드">
        <span class="ico-moon" aria-hidden="true">☾</span>
        <span class="ico-sun" aria-hidden="true">☀</span>
      </button>
    </div>
  </header>

  <main id="main">

    <!-- ============ HEADER LAPORAN ============ -->
    <section class="card sheet-head">
      <div class="head-top">
        <div class="company">업체명 <b>창원정밀</b></div>
        <h2 class="doc-title">작업일보 <span id="docDate"></span></h2>
      </div>
      <div class="head-ctrl">
        <div class="field">
          <span class="lbl">날짜</span>
          <div class="date-nav">
            <button type="button" class="btn btn-icon" id="prevDay" aria-label="이전 날짜">◀</button>
            <input type="date" id="sheetDate" aria-label="날짜">
            <button type="button" class="btn btn-icon" id="nextDay" aria-label="다음 날짜">▶</button>
            <button type="button" class="btn" id="todayBtn">오늘</button>
          </div>
        </div>
        <div class="field">
          <span class="lbl">근무</span>
          <div class="seg" role="radiogroup" aria-label="근무 구분">
            <label><input type="radio" name="shift" value="주간" checked><span>☀ 주간</span></label>
            <label><input type="radio" name="shift" value="야간"><span>☾ 야간</span></label>
          </div>
        </div>
      </div>
      <p class="work-hours">근무시간 <span id="whDay">(주간) 07:30~19:00</span> / <span id="whSat">(토) 07:30~16:00</span></p>
    </section>

    <!-- ============ TABEL ISIAN ============ -->
    <section class="card sheet-card">
      <div class="card-head sheet-toolbar">
        <div class="hist-title">
          <span class="tag tag-mint">작업</span>
          <h2>작업 내역</h2>
        </div>
        <div class="toolbar-actions">
          <span class="sheet-stats" id="sheetStats"></span>
          <button type="button" id="copyAllBtn" class="btn btn-sm btn-lemon">📋 표 전체 복사</button>
        </div>
      </div>

      <div class="col-copy">
        <span class="lbl">열 복사</span>
        <div class="chips" id="colChips"></div>
      </div>

      <div class="sheet-wrap">
        <div class="sheet" id="sheet">
          <div class="srow shead" id="sheetHead"></div>
          <div id="rows"></div>
          <div class="srow sfoot" id="totals"></div>
        </div>
      </div>
      <p class="sheet-hint"><b>＋ 작업 추가</b>를 누르면 새 줄이 추가됩니다. 입력한 내용은 <b>저장 버튼을 누르지 않아도 자동 저장</b>되며, 저장 후에도 바로 수정할 수 있습니다.</p>
    </section>

    <!-- ============ 특이사항 ============ -->
    <section class="card">
      <div class="card-head">
        <span class="tag tag-lav">※</span>
        <h2>특이사항</h2>
      </div>
      <label class="field">
        <span class="lbl sr-only">특이사항</span>
        <textarea id="noteText" rows="3" autocapitalize="characters" placeholder="이 근무조의 특이사항"></textarea>
      </label>
    </section>

    <div class="submit-bar">
      <button type="button" id="addRowBtn" class="btn btn-sky">＋ 작업 추가</button>
      <button type="button" id="saveBtn" class="btn btn-primary btn-lg">저장 ✓</button>
    </div>

    <p class="foot">입력한 내용은 자동으로 공장 서버에 저장되어 모든 기기에서 공유됩니다. 오프라인일 때 입력한 내용은 연결되면 자동 전송됩니다.</p>
  </main>

  <datalist id="dl_worker"></datalist>
  <datalist id="dl_machine"></datalist>
  <datalist id="dl_item"></datalist>
  <datalist id="dl_client"></datalist>
  <datalist id="dl_process"></datalist>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

  <!-- Custom modal (pengganti alert/confirm) -->
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <span class="modal-ico" id="modalIco">i</span>
        <h3 id="modalTitle">알림</h3>
      </div>
      <div class="modal-body" id="modalMsg"></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="modalCancel">취소</button>
        <button type="button" class="btn btn-primary" id="modalOk">확인</button>
      </div>
    </div>
  </div>

  <script src="config.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
